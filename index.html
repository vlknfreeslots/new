<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенческий Помощник</title>
    <style>
        :root {
            --primary-color: #6200ee;
            --secondary-color: #03dac6;
            --background: #f5f5f7;
            --surface: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --ai-color: #8a2be2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { margin: 0; color: var(--primary-color); }
        p { color: var(--text-light); margin: 5px 0 0 0; }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        h2 { margin-top: 0; color: var(--primary-color); border-bottom: 2px solid #eee; padding-bottom: 8px; }

        /* Стили расписания */
        .schedule-input-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #4b00b8; }

        .schedule-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .schedule-item:last-child { border-bottom: none; }
        .delete-btn { background-color: #ff3b30; padding: 5px 10px; }
        .delete-btn:hover { background-color: #d32f2f; }

        /* Стили калькулятора */
        .calc-screen {
            width: 100%;
            height: 50px;
            background: #f0f0f2;
            border: none;
            border-radius: 8px;
            text-align: right;
            padding: 10px;
            font-size: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-grid button {
            height: 50px;
            font-size: 18px;
            background-color: #e5e5ea;
            color: black;
        }

        .calc-grid button.operator { background-color: #ff9500; color: white; }
        .calc-grid button.equal { background-color: var(--primary-color); color: white; }
        .calc-grid button:hover { opacity: 0.8; }

        /* Стили промо-блока Examka AI */
        .examka-promo {
            background: linear-gradient(135deg, #8a2be2, #4a00e0);
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .examka-promo h2 { color: white; border: none; }
        .examka-btn {
            display: inline-block;
            background-color: #03dac6;
            color: #333;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .examka-btn:hover {
            transform: scale(1.05);
            background-color: #02bfae;
        }

        @media (max-width: 600px) {
            .schedule-input-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎓 Мой Помощник</h1>
        <p>Расписание, расчеты и ИИ под рукой</p>
    </header>

    <!-- БЛОК 1: РАСПИСАНИЕ -->
    <div class="card">
        <h2>📅 Расписание занятий</h2>
        <div class="schedule-input-group">
            <input type="text" id="subject" placeholder="Название предмета">
            <input type="time" id="time">
            <input type="text" id="room" placeholder="Аудитория">
            <button onclick="addLesson()">Добавить</button>
        </div>
        <ul class="schedule-list" id="scheduleList">
            <!-- Сюда добавляются уроки -->
        </ul>
    </div>

    <!-- БЛОК 2: КАЛЬКУЛЯТОР -->
    <div class="card">
        <h2>🧮 Калькулятор</h2>
        <input type="text" class="calc-screen" id="calcScreen" readonly>
        <div class="calc-grid">
            <button onclick="clearCalc()">C</button>
            <button onclick="pressCalc('(')">(</button>
            <button onclick="pressCalc(')')">)</button>
            <button class="operator" onclick="pressCalc('/')">/</button>
            
            <button onclick="pressCalc('7')">7</button>
            <button onclick="pressCalc('8')">8</button>
            <button onclick="pressCalc('9')">9</button>
            <button class="operator" onclick="pressCalc('*')">*</button>
            
            <button onclick="pressCalc('4')">4</button>
            <button onclick="pressCalc('5')">5</button>
            <button onclick="pressCalc('6')">6</button>
            <button class="operator" onclick="pressCalc('-')">-</button>
            
            <button onclick="pressCalc('1')">1</button>
            <button onclick="pressCalc('2')">2</button>
            <button onclick="pressCalc('3')">3</button>
            <button class="operator" onclick="pressCalc('+')">+</button>
            
            <button onclick="pressCalc('0')">0</button>
            <button onclick="pressCalc('.')">.</button>
            <button class="equal" onclick="calculateResult()" grid-column="span 2">=</button>
        </div>
    </div>

    <!-- БЛОК 3: ПАРТНЕРСКИЙ БАННЕР EXAMKA AI -->
    <div class="card examka-promo">
        <h2>✨ Сложная задача или реферат?</h2>
        <p>Нейросеть Examka AI напишет курсовую, решит высшую математику, сделает чертеж или презентацию за пару минут по ГОСТу!</p>
        <!-- Вставьте вашу реферальную ссылку из кабинета https://examka.ai -->
        <a href="https://examka.ai" target="_blank" class="examka-btn">Решить через Examka ИИ →</a>
    </div>
</div>

<script>
    // --- ЛОГИКА РАСПИСАНИЯ ---
    function loadSchedule() {
        const localData = localStorage.getItem('student_schedule');
        const lessons = localData ? JSON.parse(localData) : [];
        const list = document.getElementById('scheduleList');
        list.innerHTML = '';
        
        lessons.forEach((lesson, index) => {
            const li = document.createElement('li');
            li.className = 'schedule-item';
            li.innerHTML = `
                <div>
                    <strong>${lesson.time}</strong> — ${lesson.subject} 
                    <span style="color: var(--text-light)">[Ауд. ${lesson.room}]</span>
                </div>
                <button class="delete-btn" onclick="deleteLesson(${index})">Удалить</button>
            `;
            list.appendChild(li);
        });
    }

    function addLesson() {
        const subject = document.getElementById('subject').value;
        const time = document.getElementById('time').value;
        const room = document.getElementById('room').value;

        if (!subject || !time || !room) {
            alert('Пожалуйста, заполните все поля расписания.');
            return;
        }

        const localData = localStorage.getItem('student_schedule');
        const lessons = localData ? JSON.parse(localData) : [];
        lessons.push({ subject, time, room });
        
        // Сортировка по времени
        lessons.sort((a, b) => a.time.localeCompare(b.time));
        
        localStorage.setItem('student_schedule', JSON.stringify(lessons));
        loadSchedule();

        // Очистка полей
        document.getElementById('subject').value = '';
        document.getElementById('time').value = '';
        document.getElementById('room').value = '';
    }

    function deleteLesson(index) {
        const localData = localStorage.getItem('student_schedule');
        let lessons = localData ? JSON.parse(localData) : [];
        lessons.splice(index, 1);
        localStorage.setItem('student_schedule', JSON.stringify(lessons));
        loadSchedule();
    }

    // --- ЛОГИКА КАЛЬКУЛЯТОРА ---
    const screen = document.getElementById('calcScreen');

    function pressCalc(val) {
        screen.value += val;
    }

    function clearCalc() {
        screen.value = '';
    }

    function calculateResult() {
        try {
            // Безопасное вычисление простой строки
            if(screen.value) {
                screen.value = Function('"use strict";return (' + screen.value + ')')();
            }
        } catch (error) {
            screen.value = 'Ошибка';
        }
    }

    // Инициализация при загрузке страницы
    window.onload = loadSchedule;
</script>

</body>
</html>
