<script>
    // --- УПРАВЛЕНИЕ ВКЛАДКАМИ ---
    function switchTab(event, tabId) {
        const contents = document.querySelectorAll('.tab-content');
        contents.forEach(content => content.classList.remove('active'));

        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // --- УПРАВЛЕНИЕ ТЕМОЙ ---
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        document.getElementById('themeToggle').innerText = newTheme === 'dark' ? '☀️ Светлая тема' : '🌙 Темная тема';
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️ Светлая тема' : '🌙 Темная тема';
    }

    // --- ЛОГИКА РАСПИСАНИЯ ---
    function loadSchedule() {
        const localData = localStorage.getItem('student_schedule');
        const lessons = localData ? JSON.parse(localData) : [];
        const list = document.getElementById('scheduleList');
        list.innerHTML = '';
        
        lessons.forEach((lesson, index) => {
            const li = document.createElement('li');
            li.className = 'schedule-item';
            
            // Безопасное создание структуры
            li.innerHTML = `
                <div>
                    <strong>${lesson.time}</strong> — ${lesson.subject} 
                    <span style="color: var(--text-light)">[Ауд. ${lesson.room}]</span>
                </div>
            `;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = 'Удалить';
            delBtn.onclick = function() { deleteLesson(index); };
            
            li.appendChild(delBtn);
            list.appendChild(li);
        });
    }

    function addLesson() {
        const subject = document.getElementById('subject').value.trim();
        const time = document.getElementById('time').value;
        const room = document.getElementById('room').value.trim();

        if (!subject || !time || !room) {
            alert('Заполните все поля!');
            return;
        }

        const localData = localStorage.getItem('student_schedule');
        const lessons = localData ? JSON.parse(localData) : [];
        lessons.push({ subject, time, room });
        lessons.sort((a, b) => a.time.localeCompare(b.time));
        
        localStorage.setItem('student_schedule', JSON.stringify(lessons));
        loadSchedule();

        document.getElementById('subject').value = '';
        document.getElementById('time').value = '';
        document.getElementById('room').value = '';
    }

    function deleteLesson(index) {
        const localData = localStorage.getItem('student_schedule');
        if (!localData) return;
        let lessons = JSON.parse(localData);
        lessons.splice(index, 1);
        localStorage.setItem('student_schedule', JSON.stringify(lessons));
        loadSchedule();
    }

    // --- НАДЕЖНАЯ ЛОГИКА КАЛЬКУЛЯТОРА ---
    const screen = document.getElementById('calcScreen');
    
    function pressCalc(val) { 
        if (screen.value === 'Ошибка') screen.value = '';
        screen.value += val; 
    }
    
    function clearCalc() { 
        screen.value = ''; 
    }
    
    function calculateResult() {
        try {
            let expression = screen.value;
            if (!expression) return;
            
            // Очищаем строку от любых опасных символов, разрешаем только математику
            expression = expression.replace(/[^0-9+\-*/().]/g, '');
            
            // Безопасное и гарантированное вычисление без использования устаревшего eval
            const result = new Function(`return (${expression})`)();
            
            if (result === undefined || isNaN(result) || !isFinite(result)) {
                screen.value = 'Ошибка';
            } else {
                screen.value = Number(result.toFixed(8)).toString(); // Округляем длинные дроби
            }
        } catch (e) { 
            screen.value = 'Ошибка'; 
        }
    }

    // --- ЛОГИКА ЗАМЕТОК ---
    function saveNotes() {
        const text = document.getElementById('notesArea').value;
        localStorage.setItem('student_notes', text);
    }
    function loadNotes() {
        const savedText = localStorage.getItem('student_notes') || '';
        document.getElementById('notesArea').value = savedText;
    }

    // Инициализация при загрузке страницы
    window.onload = function() {
        initTheme();
        loadSchedule();
        loadNotes();
    }
</script>
