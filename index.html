<script>
    // --- УПРАВЛЕНИЕ ВКЛАДКАМИ ---
    function switchTab(event, tabId) {
        const contents = document.querySelectorAll('.tab-content');
        contents.forEach(c => c.classList.remove('active'));
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // --- УПРАВЛЕНИЕ ТЕМОЙ ---
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('themeToggle').innerText = next === 'dark' ? '☀️ Светлая тема' : '🌙 Темная тема';
    }

    function initTheme() {
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        document.getElementById('themeToggle').innerText = saved === 'dark' ? '☀️ Светлая тема' : '🌙 Темная тема';
    }

    // --- ЛОГИКА РАСПИСАНИЯ ---
    function loadSchedule() {
        const data = localStorage.getItem('student_schedule');
        const lessons = data ? JSON.parse(data) : [];
        const list = document.getElementById('scheduleList');
        list.innerHTML = '';
        
        lessons.forEach((lesson, index) => {
            const li = document.createElement('li');
            li.className = 'schedule-item';
            
            const infoDiv = document.createElement('div');
            infoDiv.innerHTML = `<strong>${lesson.time}</strong> — ${lesson.subject} <span style="color: var(--text-light)">[Ауд. ${lesson.room}]</span>`;
            li.appendChild(infoDiv);
            
            const btn = document.createElement('button');
            btn.className = 'delete-btn';
            btn.innerText = 'Удалить';
            btn.addEventListener('click', function() { deleteLesson(index); });
            
            li.appendChild(btn);
            list.appendChild(li);
        });
    }

    function addLesson() {
        const subject = document.getElementById('subject').value.trim();
        const time = document.getElementById('time').value;
        const room = document.getElementById('room').value.trim();

        if (!subject || !time || !room) return alert('Заполните все поля!');

        const data = localStorage.getItem('student_schedule');
        const lessons = data ? JSON.parse(data) : [];
        lessons.push({ subject, time, room });
        lessons.sort((a, b) => a.time.localeCompare(b.time));
        localStorage.setItem('student_schedule', JSON.stringify(lessons));
        loadSchedule();

        document.getElementById('subject').value = '';
        document.getElementById('time').value = '';
        document.getElementById('room').value = '';
    }

    function deleteLesson(index) {
        const data = localStorage.getItem('student_schedule');
        if (!data) return;
        let lessons = JSON.parse(data);
        lessons.splice(index, 1);
        localStorage.setItem('student_schedule', JSON.stringify(lessons));
        loadSchedule();
    }

    // --- БЕЗОПАСНЫЙ И НАДЕЖНЫЙ КАЛЬКУЛЯТОР ---
    const screen = document.getElementById('calcScreen');
    
    function pressCalc(val) { 
        if (screen.value === 'Ошибка') screen.value = '';
        screen.value += val; 
    }
    
    function clearCalc() { screen.value = ''; }

    // Безопасный разбор простого математического выражения (Tokenizing + Math)
    function safeEval(str) {
        // Разрешаем только цифры и знаки: + - * / . ( )
        str = str.replace(/[^0-9+\-*/().]/g, '');
        if (!str) return '';
        
        // Быстрый расчет базовых выражений без вложенных скобок
        try {
            const tokens = str.match(/([0-9.]+)|([+\-*/()])/g);
            if (!tokens) return 'Ошибка';
            
            // Парсинг умножения и деления, затем сложения и вычитания
            let values = [];
            let ops = [];
            
            for (let i = 0; i < tokens.length; i++) {
                let token = tokens[i];
                if (!isNaN(token)) {
                    values.push(parseFloat(token));
                } else if (token === '+' || token === '-' || token === '*' || token === '/') {
                    while (ops.length && hasPrecedence(token, ops[ops.length - 1])) {
                        values.push(applyOp(ops.pop(), values.pop(), values.pop()));
                    }
                    ops.push(token);
                }
            }
            while (ops.length) {
                values.push(applyOp(ops.pop(), values.pop(), values.pop()));
            }
            return values[0];
        } catch (e) {
            return 'Ошибка';
        }
    }

    function hasPrecedence(op1, op2) {
        if ((op1 === '*' || op1 === '/') && (op2 === '+' || op2 === '-')) return false;
        return true;
    }

    function applyOp(op, b, a) {
        if (a === undefined || b === undefined) return 0;
        switch (op) {
            case '+': return a + b;
            case '-': return a - b;
            case '*': return a * b;
            case '/': return b === 0 ? 0 : a / b;
        }
        return 0;
    }

    function calculateResult() {
        const res = safeEval(screen.value);
        if (res === 'Ошибка' || isNaN(res) || !isFinite(res)) {
            screen.value = 'Ошибка';
        } else {
            screen.value = Number(res.toFixed(8)).toString();
        }
    }

    // --- ЛОГИКА ЗАМЕТОК ---
    function saveNotes() { localStorage.setItem('student_notes', document.getElementById('notesArea').value); }
    function loadNotes() { document.getElementById('notesArea').value = localStorage.getItem('student_notes') || ''; }

    window.onload = function() {
        initTheme();
        loadSchedule();
        loadNotes();
    }
</script>
